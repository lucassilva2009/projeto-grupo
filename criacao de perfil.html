
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FitIA - Criar perfil</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f4f4f9;
            font-family: 'Montserrat', sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 650px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            font-size: 42px;
            font-weight: 800;
            color: #2D31FA;
            margin-bottom: 5px;
        }

        .subtitulo {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: 600;
            color: #333;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #2D31FA;
        }

        .linha {
            display: flex;
            gap: 15px;
        }

        .campo {
            flex: 1;
        }

        button {
            width: 100%;
            margin-top: 30px;
            padding: 15px;
            border: none;
            border-radius: 10px;

            background: #2D31FA;
            color: white;

            font-family: inherit;
            font-size: 16px;
            font-weight: 700;

            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #2024d8;
            transform: translateY(-2px);
        }

        .aviso {
            margin-top: 20px;
            font-size: 12px;
            color: #777;
            text-align: center;
            line-height: 1.5;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            .linha {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">FitIA</div>

    <p class="subtitulo">
        
    </p>

<form action="salvarperfil.php" method="POST">

        <label for="nome">Nome</label>
        <input
            type="text"
            id="nome"
            name="nome"
            maxlength="100"
            autocomplete="name"
            placeholder="Digite seu nome"
            required
        >

        <div class="linha">

            <div class="campo">
                <label for="idade">Idade</label>
                <input
                    type="number"
                    id="idade"
                    name="idade"
                    min="1"
                    max="120"
                    placeholder="Ex.: 18"
                    required
                >
            </div>

            <div class="campo">
                <label for="sexo">Sexo</label>

                <select id="sexo" name="sexo" required>
                    <option value="">Selecione</option>
                    <option value="masculino">Masculino</option>
                    <option value="feminino">Feminino</option>
                    <option value="outro">Outro</option>
                    <option value="nao_informar">Prefiro não informar</option>
                </select>
            </div>

        </div>

        <div class="linha">

            <div class="campo">

                <label for="peso">Peso (kg)</label>

                <input
                    type="number"
                    id="peso"
                    name="peso"
                    step="0.1"
                    max="500"
                    min="1"
                    placeholder="Ex.: 70.5"
                    required
                >

            </div>

            <div class="campo">

                <label for="altura">Altura (m)</label>

                <input
                    type="number"
                    id="altura"
                    name="altura"
                    step="0.01"
                    min="0.5"
                    max="2.5"
                    placeholder="Ex.: 1.75"
                    required
                >

            </div>

        </div>

        <label for="atividade">Nível de atividade física</label>

        <select id="atividade" name="atividade" required>
            <option value="" disabled selected>Selecione</option>


            <option value="sedentario">Sedentário</option>

            <option value="leve">Leve</option>

            <option value="moderado">Moderado</option>

            <option value="alto">Alto</option>

        </select>

        <label for="objetivo">Objetivo</label>

        <select id="objetivo" name="objetivo" required>
            <option value="" disabled selected>Selecione</option>


            <option value="ganhar_massa">Ganhar massa muscular</option>

            <option value="manter">Manter o peso</option>

            <option value="condicionamento">Melhorar o condicionamento</option>

            <option value="reduzir_peso">Reduzir peso</option>

        </select>

<button type="submit">Criar perfil</button>

    </form>

    <p class="aviso">
        
    </p>

</div>

</body>
</html>
